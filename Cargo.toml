[package]
name = "codexmu"
version = "0.2.1"
edition = "2024"
rust-version = "1.89"
description = "Standalone multi-account manager and automatic account switching for Codex"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "io-std", "signal", "time", "net"] }
time = { version = "0.3", features = ["formatting"] }
tokio-tungstenite = "0.28"
futures-util = { version = "0.3", features = ["sink"] }

[target."cfg(unix)".dependencies]
crossterm = { version = "0.29", default-features = false }
portable-pty = "0.9"
unicode-width = "0.2"
vt100 = "0.16"
